name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: development
      JWT_SECRET: isolated-ci-secret-not-used-outside-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --require-hashes -r backend/requirements-dev.lock
          backend/.venv/bin/pip install --no-deps -e ./backend
      - name: Backend lint and tests
        working-directory: backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/pytest
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run check:unused
          npm test
      - name: Production build
        working-directory: frontend
        env:
          INTERNAL_API_URL: http://127.0.0.1:8410
        run: npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regressions with disposable database and SMTP
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
